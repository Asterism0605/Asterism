<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MoodboardOrbit · Three.js Demo</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:#060608;color:#f0ede6;font-family:ui-monospace,'SF Mono',monospace;height:100vh;overflow:hidden;display:flex;flex-direction:column}
header{padding:18px 28px 12px;flex-shrink:0}
header .eyebrow{font-size:10px;letter-spacing:3px;color:rgba(240,237,230,.3);text-transform:uppercase;margin-bottom:5px}
header h2{font-size:18px;font-weight:500}
header p{font-size:11px;color:rgba(240,237,230,.35);margin-top:3px}
.tabs{display:flex;gap:8px;padding:0 28px 12px;flex-shrink:0}
.tab{padding:6px 18px;border-radius:3px;border:1px solid rgba(240,237,230,.14);background:transparent;color:rgba(240,237,230,.4);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:.2s;font-family:inherit}
.tab:hover{border-color:rgba(240,237,230,.3);color:rgba(240,237,230,.7)}
.tab.active{border-color:rgba(240,237,230,.5);color:#f0ede6;background:rgba(240,237,230,.06)}
.scenes{flex:1;position:relative;min-height:0}
.scene{position:absolute;inset:0;display:none}
.scene.active{display:block}
canvas{display:block;width:100%!important;height:100%!important}
.badge{position:absolute;bottom:18px;left:28px}
.badge-name{font-size:9px;letter-spacing:2.5px;color:rgba(240,237,230,.28);text-transform:uppercase;margin-bottom:3px}
.badge-desc{font-size:11px;color:rgba(240,237,230,.22);max-width:300px;line-height:1.65}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#060608;z-index:20}
#loading p{font-size:10px;letter-spacing:3px;color:rgba(240,237,230,.28);text-transform:uppercase}
</style>
</head>
<body>
<header>
  <div class="eyebrow">MoodboardOrbit · Three.js Demo</div>
  <h2>三種照片球效果，選擇方向</h2>
  <p>都用 Three.js WebGL 渲染，點擊標籤切換。照片從設計稿載入。</p>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchScene('a',this)">A — 球面自轉</button>
  <button class="tab" onclick="switchScene('b',this)">B — 原子軌道</button>
  <button class="tab" onclick="switchScene('c',this)">C — 景深球</button>
</div>

<div class="scenes" id="scenes">
  <div class="scene active" id="scene-a">
    <canvas id="cv-a"></canvas>
    <div class="badge">
      <div class="badge-name">Sphere Rotation · Billboard</div>
      <div class="badge-desc">照片貼在球面一起旋轉，透視攝影機自動產生近大遠小。始終看到正面。</div>
    </div>
  </div>
  <div class="scene" id="scene-b">
    <canvas id="cv-b"></canvas>
    <div class="badge">
      <div class="badge-name">Atomic Orbital · Independent Rings</div>
      <div class="badge-desc">每張照片各自沿傾斜軌道運行，三條軌道速度不同，動感強烈，立體交錯。</div>
    </div>
  </div>
  <div class="scene" id="scene-c">
    <canvas id="cv-c"></canvas>
    <div class="badge">
      <div class="badge-name">Depth of Field · Bokeh Float</div>
      <div class="badge-desc">照片漂浮在不同深度，前景銳利清晰，背景模糊縮小，鏡頭景深感。</div>
    </div>
  </div>
  <div id="loading"><p>Loading…</p></div>
</div>

<script>
// ── config ──────────────────────────────────────────────
const IMG_URLS = [
  'http://localhost:5173/images/image1.png',
  'http://localhost:5173/images/image2.png',
  'http://localhost:5173/images/image3.png',
  'http://localhost:5173/images/image4.png',
  'http://localhost:5173/images/image5.png',
  'http://localhost:5173/images/image2.png',
  'http://localhost:5173/images/image4.png',
  'http://localhost:5173/images/image1.png',
  'http://localhost:5173/images/image3.png',
];

const FALLBACK_COLS = [
  '#0d1520','#150d20','#0d1a0d','#1a0d0d','#0d151a',
  '#1a150d','#0d0d1a','#0d1a15','#1a0d15'
];

// ── scene state ─────────────────────────────────────────
const state = {};
let current = 'a';

function switchScene(id, btn) {
  current = id;
  document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('scene-' + id).classList.add('active');
  btn.classList.add('active');
}

// ── helpers ─────────────────────────────────────────────
function W() { return document.getElementById('scenes').clientWidth; }
function H() { return document.getElementById('scenes').clientHeight; }

function makeRenderer(id) {
  const cv = document.getElementById('cv-' + id);
  const r = new THREE.WebGLRenderer({ canvas: cv, alpha: true, antialias: true });
  r.setPixelRatio(devicePixelRatio);
  r.setSize(W(), H());
  r.setClearColor(0, 0);
  return r;
}
function makeCamera(fov = 50) {
  const c = new THREE.PerspectiveCamera(fov, W() / H(), 0.1, 100);
  c.position.set(0, 0, 5.5);
  return c;
}

// Fibonacci sphere positions
function fibSphere(n, r) {
  const g = (1 + Math.sqrt(5)) / 2, pts = [];
  for (let i = 0; i < n; i++) {
    const t = Math.acos(1 - 2*(i+.5)/n);
    const p = 2*Math.PI*i/g;
    pts.push(new THREE.Vector3(r*Math.sin(t)*Math.cos(p), r*Math.cos(t), r*Math.sin(t)*Math.sin(p)));
  }
  return pts;
}

function makeSprite(tex, aspect, scale = 0.9) {
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
  const s = new THREE.Sprite(mat);
  s.scale.set(scale * aspect, scale, 1);
  return s;
}

// Fallback texture
function fallbackTex(i) {
  const cv = document.createElement('canvas');
  cv.width = 200; cv.height = 260;
  const ctx = cv.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 200, 260);
  g.addColorStop(0, FALLBACK_COLS[i]); g.addColorStop(1, '#1a1a2e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 200, 260);
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1;
  ctx.strokeRect(1, 1, 198, 258);
  ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.font = 'bold 20px monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('IMG ' + (i+1), 100, 130);
  const t = new THREE.CanvasTexture(cv);
  t._aspect = 200 / 260;
  return t;
}

// Blurred texture for DoF
function blurTex(src, px) {
  const img = src.image;
  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = Math.round(256 / src._aspect);
  const ctx = cv.getContext('2d');
  ctx.filter = `blur(${px}px)`;
  ctx.drawImage(img, 0, 0, cv.width, cv.height);
  const t = new THREE.CanvasTexture(cv);
  t._aspect = src._aspect;
  return t;
}

// ── texture loading ──────────────────────────────────────
const textures = new Array(9);
let loaded = 0;

function onLoad() {
  if (++loaded < 9) return;
  document.getElementById('loading').style.display = 'none';
  initA(); initB(); initC();
  renderLoop();
  window.addEventListener('resize', onResize);
}

const loader = new THREE.TextureLoader();
loader.crossOrigin = 'anonymous';

for (let i = 0; i < 9; i++) {
  const idx = i;
  loader.load(
    IMG_URLS[idx],
    tex => {
      tex._aspect = tex.image.naturalWidth / tex.image.naturalHeight;
      textures[idx] = tex;
      onLoad();
    },
    undefined,
    () => { textures[idx] = fallbackTex(idx); onLoad(); }
  );
}

// ── Effect A: Sphere Rotation ────────────────────────────
function initA() {
  const renderer = makeRenderer('a');
  const camera = makeCamera();
  const scene = new THREE.Scene();
  const group = new THREE.Group();
  scene.add(group);

  fibSphere(9, 2.1).forEach((pos, i) => {
    const s = makeSprite(textures[i], textures[i]._aspect, 0.86);
    s.position.copy(pos);
    group.add(s);
  });

  state.a = { renderer, camera, scene, group, t: 0 };
}

// ── Effect B: Atomic Orbital ─────────────────────────────
function initB() {
  const renderer = makeRenderer('b');
  const camera = makeCamera(48);
  camera.position.set(0, 2, 6.5);
  camera.lookAt(0, 0, 0);
  const scene = new THREE.Scene();

  const rings = [
    { inclX:  0.0, inclZ: 0.0,   r: 2.3, speed: 0.009, color: 0x445566 },
    { inclX:  1.05,inclZ: 0.35,  r: 2.6, speed: 0.013, color: 0x446655 },
    { inclX: -0.7, inclZ: -0.28, r: 2.0, speed: 0.011, color: 0x665544 },
  ];

  const ringGroups = [];
  rings.forEach((def, ri) => {
    const rg = new THREE.Group();
    rg.rotation.x = def.inclX;
    rg.rotation.z = def.inclZ;
    scene.add(rg);

    // Orbital line
    const pts = [];
    for (let j = 0; j <= 128; j++) {
      const a = j / 128 * Math.PI * 2;
      pts.push(new THREE.Vector3(def.r * Math.cos(a), 0, def.r * Math.sin(a)));
    }
    rg.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({ color: def.color, transparent: true, opacity: 0.2 })
    ));

    // 3 sprites per ring
    for (let j = 0; j < 3; j++) {
      const a = (j / 3) * Math.PI * 2;
      const s = makeSprite(textures[ri * 3 + j], textures[ri * 3 + j]._aspect, 0.82);
      s.position.set(def.r * Math.cos(a), 0, def.r * Math.sin(a));
      rg.add(s);
    }
    ringGroups.push({ group: rg, speed: def.speed });
  });

  state.b = { renderer, camera, scene, ringGroups, t: 0 };
}

// ── Effect C: Depth of Field ─────────────────────────────
function initC() {
  const renderer = makeRenderer('c');
  const camera = makeCamera(52);
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x000000, 0.12);

  // Pre-bake blurred textures
  const blurred = textures.map(t => blurTex(t, 7));

  const camPos = new THREE.Vector3(0, 0, 5.5);
  const pts = fibSphere(9, 2.0);

  const sprites = pts.map((pos, i) => {
    const dist = camPos.distanceTo(pos);
    const near  = dist < 4.0;
    const far   = dist > 6.0;
    const tex   = near ? textures[i] : blurred[i];
    const op    = near ? 1.0 : far ? 0.42 : 0.72;
    const sc    = near ? 0.95 : far ? 0.62 : 0.78;

    const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: op, depthWrite: false, fog: true });
    const s = new THREE.Sprite(mat);
    s.position.copy(pos);
    s.scale.set(sc * tex._aspect, sc, 1);
    s.userData = { baseY: pos.y, phase: i * 0.78 };
    scene.add(s);
    return s;
  });

  state.c = { renderer, camera, scene, sprites, t: 0 };
}

// ── Render loop ──────────────────────────────────────────
function renderLoop() {
  requestAnimationFrame(renderLoop);
  const s = state[current];
  if (!s) return;

  if (current === 'a') {
    s.t += 0.004;
    s.group.rotation.y = s.t;
    s.group.rotation.x = Math.sin(s.t * 0.22) * 0.14;
    s.renderer.render(s.scene, s.camera);
  }
  else if (current === 'b') {
    s.t += 0.004;
    s.ringGroups.forEach(({ group, speed }) => { group.rotation.y += speed; });
    s.renderer.render(s.scene, s.camera);
  }
  else if (current === 'c') {
    s.t += 0.006;
    s.sprites.forEach(sp => {
      sp.position.y = sp.userData.baseY + Math.sin(s.t + sp.userData.phase) * 0.1;
    });
    s.camera.position.x = Math.sin(s.t * 0.18) * 0.55;
    s.camera.position.y = Math.cos(s.t * 0.14) * 0.28;
    s.camera.lookAt(0, 0, 0);
    s.renderer.render(s.scene, s.camera);
  }
}

function onResize() {
  Object.values(state).forEach(({ renderer, camera }) => {
    renderer.setSize(W(), H());
    camera.aspect = W() / H();
    camera.updateProjectionMatrix();
  });
}
</script>
</body>
</html>
