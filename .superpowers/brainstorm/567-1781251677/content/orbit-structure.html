<h2>MoodboardOrbit 頁面結構</h2>
<p class="subtitle">你進入 MoodboardOrbit 頁面後，資料夾和圖片的關係是哪一種？</p>

<div class="cards">

  <div class="card" data-choice="a" onclick="toggleSelect(this)">
    <div class="card-image" style="background:#0E0E12;padding:20px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;">
      <!-- Multiple orbits visible at once -->
      <div style="position:relative;width:220px;height:160px;">
        <!-- Orbit A (small) -->
        <div style="position:absolute;top:10px;left:10px;width:90px;height:70px;border:1.5px dashed #A8893A55;border-radius:50%;display:flex;align-items:center;justify-content:center;">
          <span style="font-size:9px;color:#A8893A;font-family:monospace;">資料夾 A</span>
        </div>
        <div style="position:absolute;top:15px;left:15px;width:14px;height:14px;border-radius:50%;background:#A8893A;"></div>
        <div style="position:absolute;top:55px;left:80px;width:12px;height:12px;border-radius:50%;background:#A8893A88;"></div>
        <!-- Orbit B (medium) -->
        <div style="position:absolute;top:30px;right:5px;width:110px;height:85px;border:1.5px dashed #C45C3A55;border-radius:50%;display:flex;align-items:center;justify-content:center;">
          <span style="font-size:9px;color:#C45C3A;font-family:monospace;">資料夾 B</span>
        </div>
        <div style="position:absolute;top:32px;right:10px;width:14px;height:14px;border-radius:50%;background:#C45C3A;"></div>
        <div style="position:absolute;top:85px;right:60px;width:11px;height:11px;border-radius:50%;background:#C45C3A88;"></div>
        <!-- Orbit C (small) -->
        <div style="position:absolute;bottom:5px;left:30px;width:80px;height:55px;border:1.5px dashed #8EC9FF55;border-radius:50%;display:flex;align-items:center;justify-content:center;">
          <span style="font-size:9px;color:#8EC9FF;font-family:monospace;">資料夾 C</span>
        </div>
        <div style="position:absolute;bottom:20px;left:35px;width:12px;height:12px;border-radius:50%;background:#8EC9FF;"></div>
      </div>
    </div>
    <div class="card-body">
      <h3>A — 多軌道同時可見</h3>
      <p>進入頁面就看到所有資料夾的軌道同時在 3D 空間裡旋轉，每個資料夾一條軌道，圖片繞著各自的圓心轉。點擊軌道才展開該資料夾細節。</p>
    </div>
  </div>

  <div class="card" data-choice="b" onclick="toggleSelect(this)">
    <div class="card-image" style="background:#0E0E12;padding:20px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;">
      <!-- Folder list + single orbit -->
      <div style="display:flex;gap:16px;align-items:center;width:220px;">
        <!-- Folder list sidebar -->
        <div style="flex-shrink:0;display:flex;flex-direction:column;gap:6px;">
          <div style="background:#A8893A33;border:1px solid #A8893A;border-radius:4px;padding:4px 10px;font-size:10px;color:#A8893A;font-family:monospace;">資料夾 A ●</div>
          <div style="background:#17171D;border:1px solid #333;border-radius:4px;padding:4px 10px;font-size:10px;color:#8A8880;font-family:monospace;">資料夾 B</div>
          <div style="background:#17171D;border:1px solid #333;border-radius:4px;padding:4px 10px;font-size:10px;color:#8A8880;font-family:monospace;">資料夾 C</div>
        </div>
        <!-- Single orbit for selected folder -->
        <div style="position:relative;width:120px;height:120px;display:flex;align-items:center;justify-content:center;">
          <div style="width:100px;height:80px;border:1.5px dashed #A8893A88;border-radius:50%;position:absolute;"></div>
          <div style="position:absolute;top:8px;left:50%;width:16px;height:16px;border-radius:50%;background:#A8893A;transform:translateX(-50%);"></div>
          <div style="position:absolute;bottom:10px;left:20px;width:13px;height:13px;border-radius:50%;background:#A8893A88;"></div>
          <div style="position:absolute;top:40px;right:5px;width:12px;height:12px;border-radius:50%;background:#A8893A66;"></div>
          <span style="font-size:9px;color:#A8893A55;font-family:monospace;z-index:1;">A 的圖片</span>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>B — 選單 + 單一軌道</h3>
      <p>左側或上方有資料夾選單，選擇一個資料夾後，中央顯示該資料夾的 3D 軌道與圖片。每次只看一個資料夾的 Orbit。</p>
    </div>
  </div>

</div>

<p class="subtitle" style="margin-top:24px;">點選你偏好的方向，或在 terminal 告訴我你的想法。</p>
